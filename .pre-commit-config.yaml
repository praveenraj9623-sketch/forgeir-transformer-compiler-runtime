repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: python -m ruff check
        language: system
        types_or: [python, pyi]
      - id: clang-format
        name: clang-format check
        entry: clang-format --dry-run --Werror
        language: system
        types_or: [c++, c]
      - id: pytest-smoke
        name: Python smoke tests
        entry: python -m pytest tests/python -q
        language: system
        pass_filenames: false
        stages: [pre-push]
